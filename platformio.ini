; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

upload_protocol = stlink
debug_tool = stlink

; PlatformIO forces "hla_swd", which the bundled OpenOCD 0.12 st-link driver rejects.
; Use the native st-link driver with plain swd instead.
upload_command = openocd -s $PLATFORMIO_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -f target/stm32f4x.cfg -c "program {$SOURCE} verify reset; shutdown;"

    ; Enable USB Serial Monitor
; monitor_port = /dev/cu.usbmodem* ;for macOS, use /dev/ttyUSB* for Linux or COM* for Windows
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    arduino-libraries/Ethernet @ ^2.0.2
    jandrassy/ArduinoOTA @ ^1.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
